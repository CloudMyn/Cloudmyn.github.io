<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tampilan Struktur Folder</title>
    <!-- Memuat Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Menggunakan font mono untuk nama file agar terlihat seperti di editor kode */
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <!-- Wrapper Utama -->
    <div class="w-full max-w-sm bg-slate-800 rounded-xl shadow-2xl p-4 border border-slate-700">
        <div class="px-2 pb-2 mb-2 border-b border-slate-700">
            <h2 class="text-lg font-semibold text-slate-200">File Explorer</h2>
            <p class="text-xs text-slate-500">project-demo</p>
        </div>

        <!-- Struktur Folder (Root) -->
        <ul class="space-y-1">
            <!-- Folder: web-32 (terbuka secara default) -->
            <li class="folder-item">
                <div
                    class="folder-toggle flex items-center p-2 rounded-md hover:bg-slate-700 cursor-pointer transition-colors duration-200">
                    <!-- Ikon Chevron -->
                    <svg class="chevron-icon w-4 h-4 mr-2 text-slate-500 transition-transform duration-200 transform"
                        fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                    <!-- Ikon Folder -->
                    <svg class="w-5 h-5 mr-2 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                    </svg>
                    <span class="font-mono text-sm text-slate-300">web-32</span>
                </div>
                <!-- Konten Folder: web-32 -->
                <ul class="pl-5 space-y-1 mt-1">
                    <li>
                        <a href="/web-32/index.html" target="_blank" rel="noopener noreferrer"
                            class="flex items-center p-2 rounded-md hover:bg-slate-700 transition-colors duration-200">
                            <svg class="w-5 h-5 mr-2 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                            <span class="font-mono text-sm text-slate-300">index.html</span>
                        </a>
                    </li>
                </ul>
            </li>

            <!-- Folder: Lainnya (tertutup secara default) -->
            <li class="folder-item">
                <div
                    class="folder-toggle flex items-center p-2 rounded-md hover:bg-slate-700 cursor-pointer transition-colors duration-200">
                    <svg class="chevron-icon w-4 h-4 mr-2 text-slate-500 transition-transform duration-200" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                    <svg class="w-5 h-5 mr-2 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                    </svg>
                    <span class="font-mono text-sm text-slate-300">web-35</span>
                </div>
                <!-- Konten Folder: web-32 -->
                <ul class="pl-5 space-y-1 mt-1">
                    <li>
                        <a href="/web-35/index.html" target="_blank" rel="noopener noreferrer"
                            class="flex items-center p-2 rounded-md hover:bg-slate-700 transition-colors duration-200">
                            <svg class="w-5 h-5 mr-2 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z" />
                            </svg>
                            <span class="font-mono text-sm text-slate-300">index.html</span>
                        </a>
                    </li>
                </ul>
            </li>

            <!-- File: index.html (di root) -->
            <li>
                <a href="javascript: void()" target="_blank" rel="noopener noreferrer"
                    class="flex items-center p-2 rounded-md hover:bg-slate-700 transition-colors duration-200">
                    <svg class="w-5 h-5 mr-2 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.75 7.5l3 2.25-3 2.25m4.5 0h3m-9 8.25h13.5A2.25 2.25 0 0021 18V6a2.25 2.25 0 00-2.25-2.25H5.25A2.25 2.25 0 003 6v12a2.25 2.25 0 002.25 2.25z" />
                    </svg>
                    <span class="font-mono text-sm text-slate-300">index.html</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Fungsi untuk inisialisasi folder yang bisa dibuka/tutup
            function initializeFolder(folderItem) {
                const toggleButton = folderItem.querySelector('.folder-toggle');
                // Pastikan hanya mencari konten di dalam folder-item ini, bukan di dalam sub-folder
                const content = folderItem.querySelector(':scope > ul');
                const chevron = folderItem.querySelector(':scope > .folder-toggle .chevron-icon');

                if (!toggleButton) return; // Lewati jika ini bukan folder (misal: file di root)

                // Cek apakah folder ini harus terbuka atau tertutup saat awal
                if (content && !content.classList.contains('hidden')) {
                    // Jika terbuka, set chevron ke bawah
                    chevron.classList.add('rotate-90');
                }

                toggleButton.addEventListener('click', () => {
                    if (content) {
                        // Toggle (sembunyikan/tampilkan) konten folder
                        content.classList.toggle('hidden');
                        // Toggle rotasi ikon chevron
                        chevron.classList.toggle('rotate-90');
                    }
                });
            }

            // Terapkan fungsionalitas ke semua item folder
            const folderItems = document.querySelectorAll('.folder-item');
            folderItems.forEach(initializeFolder);
        });
    </script>

</body>

</html>
