<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Drone Booster v4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* Custom base styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        #gameCanvas {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: #0f0f1a;
            display: block;
            max-width: 95vw;
            max-height: 75vh;
            aspect-ratio: 16 / 9;
            border-radius: 0.5rem; /* rounded-lg */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            cursor: none;
        }
        .gameOverFont {
            font-family: 'Press Start 2P', cursive;
        }
        #resetButton {
             font-family: 'Press Start 2P', cursive;
        }
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            margin-right: 0.25em;
            vertical-align: -0.125em;
            filter: invert(90%) sepia(10%) saturate(100%) hue-rotate(180deg) brightness(90%) contrast(90%); /* Adjust icon color to match text-gray-200 */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-indigo-900 text-gray-200 flex flex-col justify-center items-center min-h-screen p-4">

    <div id="uiContainer" class="w-full max-w-4xl flex justify-between items-center mb-3 px-2">
        <div id="controls" class="bg-gray-800 bg-opacity-75 p-3 rounded-lg shadow-md text-xs sm:text-sm flex items-center space-x-2">
            <span class="font-semibold">Kontrol:</span>
            <span>
                <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/rotate-ccw.svg" alt="Rotasi Booster Kiri" class="icon"> [A/←]
            </span>
            <span>|</span>
             <span>
                <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/rotate-cw.svg" alt="Rotasi Booster Kanan" class="icon"> [D/→]
            </span>
             <span>|</span>
            <span>
                <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/arrow-up-circle.svg" alt="Dorong" class="icon"> [W/↑]
            </span>
        </div>
         <div id="scoreBoard" class="bg-gray-800 bg-opacity-75 p-3 rounded-lg shadow-md text-sm sm:text-base font-bold text-green-400 flex items-center">
             <img src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/award.svg" alt="Skor" class="icon mr-2">
             <span>Skor: 0</span>
         </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="messageBox" class="w-full max-w-4xl mt-3 p-3 bg-yellow-900 bg-opacity-60 rounded-lg shadow-md text-center text-yellow-300 font-semibold text-sm min-h-[3em] flex items-center justify-center">
        </div>

    <button id="resetButton" style="display: none;" class="mt-4 px-6 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-lg shadow-lg transition duration-200 ease-in-out transform hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Mulai Ulang [R]
    </button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const resetButton = document.getElementById('resetButton');
        const scoreBoard = document.getElementById('scoreBoard').querySelector('span');
        const uiContainer = document.getElementById('uiContainer');

        let animationFrameId;
        let gameRunning = true;
        let obstacles = [];
        let obstacleSpawnTimer = 0;
        const obstacleSpawnInterval = 50;
        let score = 0;
        let startTime = 0;

        // --- Game Settings ---
        const gravity = 0.09; // Slightly increased gravity maybe
        const thrustPower = 0.15; // Power per booster
        const boosterRotationSpeed = 0.07; // How fast boosters rotate
        const maxBoosterAngle = Math.PI / 2.5; // Max rotation ~72 degrees from down
        const drag = 0.985; // Slightly more drag
        const maxSpeed = 7;
        const obstacleMinSpeed = 1.5;
        const obstacleMaxSpeed = 5.0; // Increased max obstacle speed
        const bloomIntensity = 15;

        // --- Drone Object ---
        const drone = {
            x: 0, y: 0, // Position (center of the main body)
            vx: 0, vy: 0, // Velocity of the whole drone
            thrusting: false,
            bodyColor: '#0d6efd',
            boosterColor: '#0a58ca',
            boosterActiveColor: '#FF5722',
            boosterFlameColor1: 'rgba(255, 165, 0, 0.9)',
            boosterFlameColor2: 'rgba(255, 87, 34, 0.7)',

            // Body dimensions (longer)
            bodyWidth: 18, bodyHeight: 35, // Body is now taller than wide

            // Booster properties
            boosterWidth: 10, boosterHeight: 22,
            boosterSeparation: 12, // Distance from body center to booster attachment point horizontally
            boosterOffsetY: 10,   // Vertical offset of booster attachment point from body center
            leftBoosterAngle: 0,  // Angle relative to pointing down (0 = down, positive = CW)
            rightBoosterAngle: 0, // Angle relative to pointing down (0 = down, positive = CW)

            // Draw the drone with fixed body and rotating boosters
            draw() {
                ctx.save();
                // --- Draw Main Body (Fixed Orientation - Facing Up) ---
                // No rotation needed for the body itself
                ctx.fillStyle = this.bodyColor;
                const bodyX = this.x - this.bodyWidth / 2;
                const bodyY = this.y - this.bodyHeight / 2;
                ctx.fillRect(bodyX, bodyY, this.bodyWidth, this.bodyHeight);

                // --- Draw Top Indicator (Fixed on Body) ---
                ctx.fillStyle = '#ADD8E6';
                ctx.fillRect(this.x - 2, bodyY - 5, 4, 5); // Relative to body top edge

                // --- Calculate Booster Attachment Points ---
                const leftBoosterAttachX = this.x - this.boosterSeparation;
                const rightBoosterAttachX = this.x + this.boosterSeparation;
                const boosterAttachY = this.y + this.boosterOffsetY; // Below center

                // --- Draw Left Booster ---
                this.drawBooster(leftBoosterAttachX, boosterAttachY, this.leftBoosterAngle);

                // --- Draw Right Booster ---
                this.drawBooster(rightBoosterAttachX, boosterAttachY, this.rightBoosterAngle);

                ctx.restore(); // Restore context if needed (though not strictly necessary here)
            },

            // Helper function to draw a single booster (and its flame)
            drawBooster(attachX, attachY, angle) {
                 ctx.save();
                 ctx.translate(attachX, attachY); // Move origin to attachment point
                 ctx.rotate(angle); // Rotate booster context (0 = pointing down)

                 // --- Draw Booster Flame (if thrusting) ---
                 // Flame originates from the 'bottom' of the rotated booster
                 const flameBaseY = this.boosterHeight / 2; // Relative Y position of flame base

                 if (this.thrusting) {
                     ctx.shadowColor = this.boosterFlameColor1;
                     ctx.shadowBlur = bloomIntensity;

                     const flameLength = 20 + Math.random() * 8;
                     const grad = ctx.createLinearGradient(0, 0, 0, flameLength);
                     grad.addColorStop(0, this.boosterFlameColor1);
                     grad.addColorStop(1, this.boosterFlameColor2);
                     ctx.fillStyle = grad;

                     // Draw flame shape pointing 'down' (relative to rotated booster)
                     ctx.beginPath();
                     ctx.moveTo(0, flameBaseY); // Center bottom of booster
                     ctx.lineTo(-this.boosterWidth / 3, flameBaseY + flameLength * 0.6);
                     ctx.lineTo(0, flameBaseY + flameLength); // Tip of flame
                     ctx.lineTo(this.boosterWidth / 3, flameBaseY + flameLength * 0.6);
                     ctx.closePath();
                     ctx.fill();

                     ctx.shadowBlur = 0; // Reset shadow
                 }

                 // --- Draw Booster Body ---
                 // Draw centered around the (0,0) of the translated/rotated context
                 ctx.fillStyle = this.boosterColor;
                 ctx.fillRect(-this.boosterWidth / 2, -this.boosterHeight / 2, this.boosterWidth, this.boosterHeight);

                 ctx.restore(); // Restore context to before booster drawing
            },


            // Update drone physics based on booster angles
            update() {
                // --- Apply Booster Rotation (controlled by input handler) ---
                // Angle is updated in handleInput now

                // --- Apply Thrust ---
                if (this.thrusting) {
                    // Calculate world direction angle for thrust (opposite to booster direction)
                    // Booster Angle 0 = Down (PI/2 world), Thrust Dir = Up (-PI/2 world)
                    const leftThrustDirWorld = this.leftBoosterAngle - Math.PI / 2;
                    this.vx += Math.cos(leftThrustDirWorld) * thrustPower;
                    this.vy += Math.sin(leftThrustDirWorld) * thrustPower;

                    const rightThrustDirWorld = this.rightBoosterAngle - Math.PI / 2;
                    this.vx += Math.cos(rightThrustDirWorld) * thrustPower;
                    this.vy += Math.sin(rightThrustDirWorld) * thrustPower;
                }

                // --- Apply Gravity ---
                this.vy += gravity;

                // --- Apply Drag ---
                this.vx *= drag;
                this.vy *= drag;

                // --- Limit Speed ---
                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (currentSpeed > maxSpeed) {
                    this.vx = (this.vx / currentSpeed) * maxSpeed;
                    this.vy = (this.vy / currentSpeed) * maxSpeed;
                }

                // --- Update Position ---
                this.x += this.vx;
                this.y += this.vy;

                // --- Keep drone within bounds ---
                // Use body dimensions primarily, add buffer for boosters
                const buffer = this.boosterHeight; // Simple buffer
                if (this.x - this.bodyWidth / 2 - buffer < 0) { this.x = this.bodyWidth / 2 + buffer; this.vx = 0; }
                if (this.x + this.bodyWidth / 2 + buffer > canvas.width) { this.x = canvas.width - this.bodyWidth / 2 - buffer; this.vx = 0; }
                if (this.y - this.bodyHeight / 2 < 0) { this.y = this.bodyHeight / 2; this.vy = 0; }
                // Falling off bottom handled in gameLoop
            },

            // Collision check using fixed body and booster approximations
            checkCollision(obstacle) {
                 const bodyTop = this.y - this.bodyHeight / 2;
                 const bodyBottom = this.y + this.bodyHeight / 2;
                 const bodyLeft = this.x - this.bodyWidth / 2;
                 const bodyRight = this.x + this.bodyWidth / 2;

                 // Approximate the maximum reach of boosters
                 const maxReachX = this.boosterSeparation + this.boosterHeight * Math.sin(maxBoosterAngle) + this.boosterWidth/2;
                 const maxReachY = this.boosterOffsetY + this.boosterHeight * Math.cos(0) + this.boosterHeight/2; // Max downward reach

                 const collisionLeft = this.x - maxReachX;
                 const collisionRight = this.x + maxReachX;
                 const collisionTop = bodyTop - this.boosterWidth; // Approx top reach if rotated sideways
                 const collisionBottom = this.y + maxReachY;

                 // Check overlap between obstacle and estimated drone bounds
                 return (
                     collisionLeft < obstacle.x + obstacle.size &&
                     collisionRight > obstacle.x &&
                     collisionTop < obstacle.y + obstacle.size &&
                     collisionBottom > obstacle.y
                 );
            }
        };

        // --- Obstacle Object --- (No changes needed)
        function createObstacle() {
            const size = 15 + Math.random() * 25;
            let x, y, vx, vy;
            const edge = Math.floor(Math.random() * 4);
            const speed = obstacleMinSpeed + Math.random() * (obstacleMaxSpeed - obstacleMinSpeed);

            switch (edge) { /* Same as before */
                case 0: x = Math.random() * canvas.width; y = -size; break;
                case 1: x = canvas.width + size; y = Math.random() * canvas.height; break;
                case 2: x = Math.random() * canvas.width; y = canvas.height + size; break;
                case 3: x = -size; y = Math.random() * canvas.height; break;
            }
            const targetX = canvas.width / 2 + (Math.random() - 0.5) * (canvas.width * 0.5);
            const targetY = canvas.height / 2 + (Math.random() - 0.5) * (canvas.height * 0.5);
            const dx = targetX - x; const dy = targetY - y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            vx = (dx / dist) * speed; vy = (dy / dist) * speed;

            return { /* Same as before */
                x, y, vx, vy, size, color: `hsl(${Math.random() * 60 + 180}, 70%, 50%)`,
                draw() { ctx.fillStyle = this.color; ctx.beginPath(); const points = 5 + Math.floor(Math.random()*4); for(let i = 0; i < points; i++) { const angle = (i / points) * Math.PI * 2; const radius = this.size / 2 * (0.8 + Math.random() * 0.4); const px = this.x + this.size / 2 + Math.cos(angle) * radius; const py = this.y + this.size / 2 + Math.sin(angle) * radius; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); } ctx.closePath(); ctx.fill(); },
                update() { this.x += this.vx; this.y += this.vy; }
            };
        }

        // --- Input Handling ---
        const keysPressed = {};
        window.addEventListener('keydown', (e) => { /* Same restart logic */
            const key = e.key.toLowerCase();
            if (!gameRunning && key === 'r') { resizeCanvas(); resetGame(); return; }
            if (gameRunning) { keysPressed[key] = true; if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) { e.preventDefault(); } }
        });
        window.addEventListener('keyup', (e) => { /* Same logic */
            if (gameRunning) { keysPressed[e.key.toLowerCase()] = false; }
        });

        function handleInput() {
            // Booster Rotation Control (A/D rotate both boosters)
            let rotationChange = 0;
            if (keysPressed['a'] || keysPressed['arrowleft']) { rotationChange = -boosterRotationSpeed; } // Rotate CCW (relative to down)
            if (keysPressed['d'] || keysPressed['arrowright']) { rotationChange = boosterRotationSpeed; } // Rotate CW (relative to down)

            // Apply rotation and clamp
            drone.leftBoosterAngle = Math.max(-maxBoosterAngle, Math.min(maxBoosterAngle, drone.leftBoosterAngle + rotationChange));
            drone.rightBoosterAngle = Math.max(-maxBoosterAngle, Math.min(maxBoosterAngle, drone.rightBoosterAngle + rotationChange));

            // Thrust Control
            drone.thrusting = keysPressed['w'] || keysPressed['arrowup'];
        }

        // --- Game Loop ---
        function gameLoop(currentTime) { /* Mostly the same */
             if (!startTime) { startTime = currentTime; }

            if (!gameRunning) { /* Same Game Over display */
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.textAlign = 'center';
                ctx.font = '30px "Press Start 2P"'; ctx.fillStyle = '#FF5722'; ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.font = '20px "Press Start 2P"'; ctx.fillStyle = '#ffcc00'; ctx.fillText(`Skor Akhir: ${score}`, canvas.width / 2, canvas.height / 2);
                ctx.font = '14px "Press Start 2P"'; ctx.fillStyle = '#cccccc'; ctx.fillText("Tekan [R] untuk Mulai Ulang", canvas.width / 2, canvas.height / 2 + 40);
                resetButton.style.display = 'block'; return;
            }

            // --- Game Running Logic ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            handleInput(); // Update booster angles based on input
            drone.update(); // Update physics and position

            // Spawn Obstacles /* Same logic */
            obstacleSpawnTimer++;
            if (obstacleSpawnTimer >= obstacleSpawnInterval) { obstacles.push(createObstacle()); obstacleSpawnTimer = 0; }

            // Update and Draw Obstacles /* Same logic */
            obstacles.forEach((obs, i) => {
                obs.update(); obs.draw();
                if (drone.checkCollision(obs)) { gameRunning = false; messageBox.textContent = "Tabrakan terdeteksi!"; }
                if (obs.x < -obs.size * 2 || obs.x > canvas.width + obs.size * 2 || obs.y < -obs.size * 2 || obs.y > canvas.height + obs.size * 2) { obstacles.splice(i, 1); }
            });

            // Draw Drone
            drone.draw(); // Draws fixed body and rotated boosters

            // Update Score /* Same logic */
            const elapsedTime = Math.floor((currentTime - startTime) / 100);
            score = elapsedTime;
            scoreBoard.textContent = `Skor: ${score}`;

            // Check if drone fell off screen /* Same logic, using body height */
            if (drone.y > canvas.height + drone.bodyHeight) { gameRunning = false; messageBox.textContent = "Drone hilang!"; }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Resize Handling ---
        function resizeCanvas() { /* Same logic */
            const container = canvas.parentElement; const aspectRatio = 16 / 9;
            const uiHeight = uiContainer.offsetHeight + messageBox.offsetHeight + resetButton.offsetHeight + 30;
            const availableHeight = window.innerHeight - uiHeight;
            let newHeight = Math.min(window.innerHeight * 0.75, availableHeight); let newWidth = newHeight * aspectRatio;
            if (newWidth > container.clientWidth * 0.95) { newWidth = container.clientWidth * 0.95; newHeight = newWidth / aspectRatio; }
            canvas.width = Math.floor(newWidth); canvas.height = Math.floor(newHeight);
            uiContainer.style.maxWidth = `${canvas.width}px`; messageBox.style.maxWidth = `${canvas.width}px`;
            if (!gameRunning) { gameLoop(performance.now()); }
        }

        // --- Game Initialization ---
        function resetGame() {
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); }
            gameRunning = true; obstacles = []; obstacleSpawnTimer = 0; score = 0; startTime = 0;
            messageBox.textContent = ''; scoreBoard.textContent = `Skor: 0`; resetButton.style.display = 'none';

            // Reset drone state
            drone.x = canvas.width / 2;
            drone.y = canvas.height / 3; // Start slightly higher
            drone.vx = 0; drone.vy = 0;
            drone.leftBoosterAngle = 0; // Reset booster angles to point down
            drone.rightBoosterAngle = 0;
            drone.thrusting = false;

            Object.keys(keysPressed).forEach(key => keysPressed[key] = false);
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners --- /* Same */
        window.addEventListener('resize', resizeCanvas);
        resetButton.addEventListener('click', () => { resizeCanvas(); resetGame(); });

        // --- Initial Setup --- /* Same */
        window.onload = () => { resizeCanvas(); resetGame(); };

    </script>
</body>
</html>
